# Yazı Tipi Ayarları (Kurduktan sonra ttf-jetbrains-mono-nerd paketi kullanılacak)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# Kabuk (chsh sonrası oturum yenilenene kadar $SHELL bash kalabildiği için açıkça belirtilir)
shell /usr/bin/fish

# Pencere ve Görünüm
# Tam ekran yerine sabit boyut: fastfetch çıktısı (29 satır x 101 sütun) + istem sığar.
# Ortalama KWin penceresi kuralıyla yapılır (Wayland'de kitty konumu belirleyemez).
remember_window_size no
initial_window_width 108c
initial_window_height 34c
window_padding_width 10
confirm_os_window_close 0

# Saydamlık ve Blur (Hyprland tarzı şeffaflık)
background_opacity 0.75
background_blur 1

# KDE Plasma Wayland için gerekli ayar (Saydamlık ve blur'un doğru çalışması için)
linux_display_server wayland

# Ses ve Uyarılar
enable_audio_bell no

# --- Catppuccin Mocha Teması (Hyprland ile en uyumlu karanlık tema) ---
# vim:ft=kitty
# Name:     Catppuccin Mocha
# Author:   Catppuccin Org
# License:  MIT

foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

cursor                  #f5e0dc
cursor_text_color       #1e1e2e

url_color               #f5e0dc

active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

wayland_titlebar_color system
macos_titlebar_color system

active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# 16 Renk Paleti
# Siyah
color0 #45475a
color8 #585b70
# Kırmızı
color1 #f38ba8
color9 #f38ba8
# Yeşil
color2  #a6e3a1
color10 #a6e3a1
# Sarı
color3  #f9e2af
color11 #f9e2af
# Mavi
color4  #89b4fa
color12 #89b4fa
# Magenta (Mor)
color5  #f5c2e7
color13 #f5c2e7
# Cyan (Turkuaz)
color6  #94e2d5
color14 #94e2d5
# Beyaz
color7  #bac2de
color15 #a6adc8

# İmleç (Cursor) Animasyonları ve "Kayma" Efekti
cursor_shape beam
cursor_blink_interval 0.5
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Performans ve Gecikme (Input Lag) Optimizasyonları
repaint_delay 5
input_delay 0
sync_to_monitor yes
wayland_enable_ime no
